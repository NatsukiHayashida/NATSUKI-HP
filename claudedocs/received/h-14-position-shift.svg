<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>.t{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;fill:currentColor}.l{fill:none;stroke:currentColor;stroke-width:2}.thin{fill:none;stroke:currentColor;stroke-width:1}.a{fill:hsl(var(--primary))}.al{fill:none;stroke:hsl(var(--primary));stroke-width:3}.h{font-size:29px;font-weight:700}.b{font-size:22px}.s{font-size:18px}.n{font-size:54px;font-weight:750}</style><defs><g id="ring14"><circle class="l" r="108"/><circle class="l" r="42"/><circle class="thin" cy="-70" r="8"/><circle class="thin" cx="70" r="8"/><circle class="thin" cy="70" r="8"/><circle class="thin" cx="-70" r="8"/></g></defs>
<text class="t h" x="54" y="58">画素の差を生んでいた主因は、欠陥ではなく位置ずれだった</text><path class="thin" d="M54 80h1092"/>
