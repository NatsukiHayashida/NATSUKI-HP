<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1620" viewBox="0 0 720 1620"><style>.t{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;fill:currentColor}.l{fill:none;stroke:currentColor;stroke-width:2}.q{fill:none;stroke:currentColor;stroke-width:1}.a{fill:hsl(var(--primary))}.al{fill:none;stroke:hsl(var(--primary));stroke-width:3}.h{font-size:29px;font-weight:700}.b{font-size:23px}.s{font-size:18px}.n{font-size:36px;font-weight:750}</style>
<text class="t h" x="36" y="52">全ゲート合格。それでも加工できなかった。</text><path class="q" d="M36 76h648"/>
<g transform="translate(110 122)"><text class="t b" x="250" text-anchor="middle">原本</text><rect class="l" x="90" y="40" width="320" height="450"/><text class="t n" x="250" y="105" text-anchor="middle">A4 縦</text><text class="t n" x="250" y="166" text-anchor="middle">尺度 1:1</text><g class="l" transform="translate(150 215)"><rect width="80" height="64"/><rect x="120" width="80" height="64"/><rect x="60" y="94" width="80" height="64"/></g><text class="t b" x="250" y="410" text-anchor="middle">投影図 3面</text><text class="t s" x="250" y="450" text-anchor="middle">品番リスト・一般公差</text><text class="t s" x="250" y="480" text-anchor="middle">面粗さ・面取り あり</text></g>
<path class="l" d="M360 650v60m-10-12 10 12 10-12"/>
<g transform="translate(70 742)"><text class="t b" x="290" text-anchor="middle">納品したもの</text><rect class="l" x="20" y="42" width="540" height="380"/><text class="t n" x="290" y="105" text-anchor="middle">A3 横</text><text class="t n" x="290" y="166" text-anchor="middle">尺度 2:1</text><rect class="l" x="200" y="210" width="180" height="112"/><text class="t b" x="290" y="372" text-anchor="middle">投影図 1面</text><text class="t s a" x="290" y="460" text-anchor="middle">リスト・公差・面粗さ・面取りが欠落</text></g>
<g transform="translate(60 1250)"><rect class="l" width="600" height="118"/><text class="t b" x="24" y="42">検査対象</text><text class="t s" x="24" y="79">寸法・表題欄・図枠の内部整合</text><text class="t n" x="570" y="72" text-anchor="end">全合格</text></g>
<path class="al" d="M60 1410h600"/><text class="t b a" x="360" y="1458" text-anchor="middle">原本との一致は、検査していなかった</text><text class="t s" x="360" y="1496" text-anchor="middle">パリティ照合後、説明のつかない差は1件まで減少</text><text class="t b" x="360" y="1570" text-anchor="middle">門は、門が見ている対象しか守らない</text></svg>
