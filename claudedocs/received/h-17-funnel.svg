<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><style>.t{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;fill:currentColor}.l{fill:none;stroke:currentColor;stroke-width:2}.thin{fill:none;stroke:currentColor;stroke-width:1}.a{fill:hsl(var(--primary))}.al{fill:none;stroke:hsl(var(--primary));stroke-width:4}.h{font-size:29px;font-weight:700}.b{font-size:22px}.s{font-size:18px}.n{font-size:42px;font-weight:750}</style>
<text class="t h" x="54" y="58">直すべきは、サイトの中ではなく「サイトへ来る前」だった</text><path class="thin" d="M54 80h1092"/>
<g transform="translate(60 170)"><text class="t s" x="100" y="-42" text-anchor="middle">SNS閲覧</text><text class="t n" x="100" y="0" text-anchor="middle">86,000</text><path class="l" d="M210-8h90m-12-9 12 9-12 9"/><text class="t s" x="255" y="-28" text-anchor="middle">2.2%</text><text class="t s" x="390" y="-42" text-anchor="middle">プロフィール</text><text class="t n" x="390" text-anchor="middle">1,865</text><path class="l" d="M500-8h90m-12-9 12 9-12 9"/><text class="t s" x="545" y="-28" text-anchor="middle">44%</text><text class="t s" x="680" y="-42" text-anchor="middle">外部リンク</text><text class="t n a" x="680" text-anchor="middle">816</text><path class="l" d="M790-8h90m-12-9 12 9-12 9"/><text class="t s" x="835" y="-28" text-anchor="middle">約2.9%</text><text class="t s" x="970" y="-42" text-anchor="middle">EC注文</text><text class="t n" x="970" text-anchor="middle">24</text></g>
<path class="al" d="M60 232h680"/><text class="t b a" x="400" y="274" text-anchor="middle">入口側：外部リンクのタップが前期間比 28.5%減</text>
<rect class="l" x="810" y="105" width="330" height="210"/><text class="t b" x="975" y="146" text-anchor="middle">サイト内</text><text class="t s" x="975" y="184" text-anchor="middle">注文9,047件を分析</text><text class="t s" x="975" y="218" text-anchor="middle">購入者2,174人</text><text class="t s" x="975" y="252" text-anchor="middle">売上の約半分がリピート</text><text class="t s" x="975" y="286" text-anchor="middle">カゴ落ち率は改善</text>
<g transform="translate(100 390)"><text class="t b" y="0">同じ購入効率で以前の水準を出すには</text><path class="thin" d="M0 34h1000"/><text class="t s" y="82">現在のタップ</text><rect class="l" x="170" y="54" width="272" height="52"/><text class="t n a" x="306" y="94" text-anchor="middle">816</text><text class="t s" y="164">必要なタップ</text><rect class="l" x="170" y="136" width="800" height="52"/><text class="t n" x="570" y="176" text-anchor="middle">2,400 / 月</text></g>
<path class="thin" d="M54 660h1092"/><text class="t b" x="600" y="706" text-anchor="middle">サイトを作り直しても、細っている入口は増えない。だから「作らない」と決めた。</text></svg>
