<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1540" viewBox="0 0 720 1540"><style>.t{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;fill:currentColor}.l{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:currentColor;stroke-width:1}.a{fill:hsl(var(--primary))}.al{fill:none;stroke:hsl(var(--primary));stroke-width:3}.bg{fill:hsl(var(--background))}.h{font-size:29px;font-weight:700}.b{font-size:23px}.s{font-size:19px}.n{font-size:52px;font-weight:750}</style><defs><pattern id="p12" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="thin" d="M0 0v9"/></pattern><g id="w12"><circle class="l" cx="130" cy="104" r="92"/><circle class="l" cx="130" cy="104" r="35"/><circle class="thin" cx="130" cy="43" r="7"/><circle class="thin" cx="191" cy="104" r="7"/><circle class="thin" cx="130" cy="165" r="7"/><circle class="thin" cx="69" cy="104" r="7"/></g><g id="d12"><path class="a" d="M170 181c8-11 20-11 28-4-7 5-7 12-2 19-11-3-19 1-24 9-4-8-5-16-2-24z"/></g></defs>
<text class="t h" x="36" y="52">同じマスクでも、かける場所で結果が逆になる</text><path class="thin" d="M36 76h648"/>
<g transform="translate(70 118)"><text class="t b" y="0">失敗：入力画像を先に削った</text><g transform="translate(0 42)"><rect class="l" width="260" height="208"/><use href="#w12"/><use href="#d12"/></g><path class="l" d="M282 146h55m-10-9 10 9-10 9"/><g transform="translate(360 42)"><rect class="l" width="260" height="208"/><use href="#w12"/><use href="#d12"/><path class="bg" fill-rule="evenodd" d="M0 0h260v208H0zM16 16v176h228V16z"/><path fill="url(#p12)" fill-rule="evenodd" d="M0 0h260v208H0zM16 16v176h228V16z"/></g><text class="t s" x="310" y="300" text-anchor="middle">外周マスクが、端の欠陥まで消した</text><path class="l" d="M310 320v44m-9-10 9 10 9-10"/><text class="t s" x="310" y="404" text-anchor="middle">見逃しゼロを守るため閾値を下げる</text><text class="t n a" x="310" y="470" text-anchor="middle">過検出 72.4%</text></g>
<path class="thin" d="M36 640h648"/>
<g transform="translate(70 694)"><text class="t b" y="0">改善：推論後の異常マップから背景だけ削った</text><g transform="translate(0 42)"><rect class="l" width="260" height="208"/><use href="#w12"/><g fill="currentColor"><circle cx="12" cy="12" r="7"/><circle cx="248" cy="12" r="7"/><circle cx="12" cy="196" r="7"/><circle cx="248" cy="196" r="7"/></g><use href="#d12"/></g><path class="l" d="M282 146h55m-10-9 10 9-10 9"/><g transform="translate(360 42)"><rect class="l" width="260" height="208"/><use href="#w12"/><path fill="url(#p12)" fill-rule="evenodd" d="M0 0h260v208H0zM130 104m-103 0a103 103 0 1 0 206 0a103 103 0 1 0-206 0"/><use href="#d12"/></g><text class="t s" x="310" y="300" text-anchor="middle">四隅の背景反応だけ消し、欠陥信号は残した</text><path class="l" d="M310 320v44m-9-10 9 10 9-10"/><text class="t s" x="310" y="404" text-anchor="middle">元画像を傷つけず、判定に必要な信号を保持</text><text class="t n a" x="310" y="470" text-anchor="middle">過検出 20.8%</text></g>
<text class="t s" x="360" y="1260" text-anchor="middle">基準：マスクなし 44.2%　／　すべて見逃しゼロ</text><path class="al" d="M36 1302h648"/><text class="t b" x="360" y="1352" text-anchor="middle">入力を削ると失うものがある。</text><text class="t b" x="360" y="1390" text-anchor="middle">出力を削れば、不要な反応だけを捨てられる。</text></svg>
