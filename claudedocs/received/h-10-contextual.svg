<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">撮影日が変わると良品の異常スコアが不良品より高くなる</title><desc id="d">同じ日の良品、不良品、別の日の良品の実測スコア範囲を一本の軸で比較する。</desc>
  <style>.tx{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;fill:currentColor}.line{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.thin{fill:none;stroke:currentColor;stroke-width:1}.dash{fill:none;stroke:currentColor;stroke-width:2;stroke-dasharray:8 7}.accent{fill:hsl(var(--primary,8 64% 46%))}.accent-line{fill:none;stroke:hsl(var(--primary,8 64% 46%));stroke-width:14;stroke-linecap:round}.range{fill:none;stroke:currentColor;stroke-width:14;stroke-linecap:round}.head{font-size:29px;font-weight:700}.body{font-size:20px}.small{font-size:17px}.num{font-size:24px;font-weight:700}.big{font-size:42px;font-weight:750}.muted{opacity:.52}</style>
  <text class="tx head" x="54" y="58">撮影日が変わっただけで、良品が不良品より「不良らしく」なった</text><path class="thin muted" d="M54 80h1092"/>
  <!-- axis mapping 0.20..0.95 to x=250..1100 -->
  <path class="line" d="M250 555h850m-10-9 10 9-10 9"/>
  <text class="tx small" x="250" y="588" text-anchor="middle">0.20</text><text class="tx small" x="1100" y="588" text-anchor="middle">0.95</text>
  <text class="tx small" x="675" y="625" text-anchor="middle">異常スコア　← 正常らしい　　　　　　　　　　　　　異常らしい →</text>
  <!-- threshold 0.323 => x389.4 -->
  <path class="dash" d="M389.4 112v443"/><text class="tx small" x="389.4" y="102" text-anchor="middle">閾値 0.323</text>

  <text class="tx body" x="54" y="184">同じ日の良品</text><text class="tx small" x="54" y="210">241枚</text>
  <path class="range" d="M298.7 195h137.1"/><circle cx="298.7" cy="195" r="8" fill="currentColor"/><circle cx="435.8" cy="195" r="8" fill="currentColor"/>
  <text class="tx small" x="298.7" y="232" text-anchor="middle">0.243</text><text class="tx small" x="435.8" y="232" text-anchor="middle">0.364</text>

  <text class="tx body" x="54" y="332">同じ日の不良品</text><text class="tx small" x="54" y="358">178枚</text>
  <path class="accent-line" d="M389.4 343h614.3"/><circle class="accent" cx="389.4" cy="343" r="8"/><circle class="accent" cx="1003.7" cy="343" r="8"/>
  <path class="line" d="M579.8 325v36"/><text class="tx small" x="579.8" y="307" text-anchor="middle">中央値</text>
  <text class="tx small" x="389.4" y="380" text-anchor="middle">0.323</text><text class="tx small" x="1003.7" y="380" text-anchor="middle">0.865</text>

  <text class="tx body" x="54" y="480">別の日の良品</text><text class="tx small" x="54" y="506">100枚</text>
  <path class="range" d="M606.7 491h250.5"/><circle cx="606.7" cy="491" r="8" fill="currentColor"/><circle cx="857.2" cy="491" r="8" fill="currentColor"/>
  <path class="line" d="M728.6 473v36"/><text class="tx small" x="728.6" y="455" text-anchor="middle">中央値</text>
  <text class="tx small" x="606.7" y="528" text-anchor="middle">0.515</text><text class="tx small" x="857.2" y="528" text-anchor="middle">0.736</text>

  <path class="thin" d="M606.7 401v46m0-23h-217.3"/><text class="tx num" x="498" y="418" text-anchor="middle">不良178枚中107枚より右側</text>
  <rect x="884" y="414" width="262" height="116" rx="2" fill="none" stroke="hsl(var(--primary,8 64% 46%))" stroke-width="2"/>
  <text class="tx small" x="1015" y="443" text-anchor="middle">別の日の良品</text>
  <text class="tx big accent" x="1015" y="486" text-anchor="middle">100枚</text>
  <text class="tx num accent" x="1015" y="516" text-anchor="middle">すべて誤検出</text>
  <text class="tx body" x="600" y="674" text-anchor="middle">同じ良品でも撮像条件が変わると分布が完全に移動し、固定閾値では分離できない。</text>
</svg>
