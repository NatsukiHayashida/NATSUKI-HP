<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><style>.t{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;fill:currentColor}.l{fill:none;stroke:currentColor;stroke-width:2}.q{fill:none;stroke:currentColor;stroke-width:1}.a{fill:hsl(var(--primary))}.al{fill:none;stroke:hsl(var(--primary));stroke-width:4}.h{font-size:30px;font-weight:700}.b{font-size:22px}.s{font-size:18px}.n{font-size:42px;font-weight:750}</style>
<text class="t h" x="60" y="58">直すべきは、サイトではなく「サイトへ来る前」だった</text><path class="q" d="M60 80h1160"/>
<g transform="translate(80 158)"><text class="t s" x="90" y="-36" text-anchor="middle">SNS閲覧</text><text class="t n" x="90">86,000</text><path class="l" d="M205-8h80m-10-9 10 9-10 9"/><text class="t s" x="245" y="-30" text-anchor="middle">2.2%</text><text class="t s" x="390" y="-36" text-anchor="middle">プロフィール</text><text class="t n" x="390" text-anchor="middle">1,865</text><path class="l" d="M500-8h80m-10-9 10 9-10 9"/><text class="t s" x="540" y="-30" text-anchor="middle">44%</text><text class="t s" x="685" y="-36" text-anchor="middle">外部リンク</text><text class="t n a" x="685" text-anchor="middle">816</text><path class="l" d="M795-8h80m-10-9 10 9-10 9"/><text class="t s" x="835" y="-30" text-anchor="middle">約2.9%</text><text class="t s" x="1000" y="-36" text-anchor="middle">EC注文</text><text class="t n" x="1000" text-anchor="middle">24</text></g>
<path class="al" d="M80 220h800"/><text class="t b a" x="480" y="258" text-anchor="middle">入口：外部リンクのタップが前期間比 28.5%減</text>
<g transform="translate(80 324)"><text class="t b" y="0">一方、サイト内は健全だった</text><rect class="l" y="32" width="1120" height="178"/><path class="q" d="M280 32v178M560 32v178M840 32v178"/><text class="t s" x="140" y="72" text-anchor="middle">分析した注文</text><text class="t n" x="140" y="128" text-anchor="middle">9,047件</text><text class="t s" x="420" y="72" text-anchor="middle">購入者</text><text class="t n" x="420" y="128" text-anchor="middle">2,174人</text><text class="t s" x="420" y="168" text-anchor="middle">2回以上617人／5回以上118人</text><text class="t s" x="700" y="72" text-anchor="middle">売上に占めるリピート</text><text class="t n" x="700" y="128" text-anchor="middle">約半分</text><text class="t s" x="980" y="72" text-anchor="middle">カゴ落ち率</text><text class="t n" x="980" y="128" text-anchor="middle">改善</text></g>
<g transform="translate(80 610)"><text class="t b">以前の水準を、同じ購入効率で出すには</text><text class="t s" y="70">現在</text><rect class="l" x="120" y="38" width="272" height="56"/><text class="t n a" x="256" y="82" text-anchor="middle">816</text><text class="t s" y="150">必要</text><rect class="l" x="120" y="118" width="800" height="56"/><text class="t n" x="520" y="162" text-anchor="middle">2,400タップ／月</text><text class="t b" x="1040" y="156" text-anchor="middle">約3倍</text></g>
<path class="q" d="M60 836h1160"/><text class="t b" x="640" y="878" text-anchor="middle">サイトを作り直しても入口は増えない。だから、作らないと決めた。</text></svg>
