<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同じマスクでも入力側と異常マップ側で結果が逆転することを示す二本のデータフロー" fill="none">
  <defs>
    <pattern id="mask-hatch-h02" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="hsl(var(--primary))" stroke-width="1" opacity=".48"/></pattern>
    <pattern id="neutral-hatch-h02" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1" opacity=".24"/></pattern>
    <marker id="flow-arrow-h02" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="currentColor"/></marker>
  </defs>

  <!-- 上下レーンの基準線 -->
  <g stroke="currentColor" stroke-width="1" opacity=".22" vector-effect="non-scaling-stroke"><path d="M42 54H958M42 226H958M42 406H958"/><path d="M54 42V66M54 214V238M54 394V418"/></g>

  <!-- 上段：入力側にマスク -->
  <!-- 01 入力画像盤 -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <rect x="62" y="82" width="118" height="112"/><circle cx="121" cy="138" r="37"/><circle cx="121" cy="138" r="12"/><path d="M151 113L163 105M157 119L169 111"/>
    <circle cx="74" cy="94" r="3"/><circle cx="168" cy="94" r="3"/><circle cx="74" cy="182" r="3"/><circle cx="168" cy="182" r="3"/>
  </g>
  <g stroke="currentColor" fill="hsl(var(--background))" stroke-width="1.25"><circle cx="78" cy="72" r="17"/></g><text x="78" y="72" fill="currentColor" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central">01</text>

  <!-- 02 入力側マスク：欠陥位置まで覆う -->
  <g stroke="hsl(var(--primary))" stroke-width="2" vector-effect="non-scaling-stroke">
    <path d="M204 88H258V188H204Z" fill="url(#mask-hatch-h02)"/>
    <path d="M214 100H248V176H214Z" fill="hsl(var(--background))"/>
    <path d="M239 100H248V126H239Z" fill="url(#mask-hatch-h02)"/>
    <path d="M180 138H204M258 138H294"/>
  </g>
  <g stroke="hsl(var(--primary))" fill="hsl(var(--background))" stroke-width="1.5"><circle cx="231" cy="72" r="17"/></g><text x="231" y="72" fill="hsl(var(--primary))" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central">02</text>

  <!-- 03 前処理盤：欠陥信号が欠けた断面 -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <path d="M294 98H388V178H294Z"/><circle cx="341" cy="138" r="28"/><circle cx="341" cy="138" r="9"/>
    <path d="M364 117L377 107V129Z" fill="url(#neutral-hatch-h02)"/>
  </g>
  <g stroke="currentColor" fill="hsl(var(--background))" stroke-width="1.25"><circle cx="308" cy="88" r="17"/></g><text x="308" y="88" fill="currentColor" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central">03</text>

  <!-- 共通モデル装置 -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <path d="M428 92H512V184H428Z"/><path d="M440 108H500V122H440ZM440 132H500V146H440ZM440 156H500V170H440Z"/>
    <path d="M388 138H428M512 138H550" marker-end="url(#flow-arrow-h02)"/>
  </g>
  <g stroke="currentColor" fill="hsl(var(--background))" stroke-width="1.25"><circle cx="442" cy="82" r="17"/></g><text x="442" y="82" fill="currentColor" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central">04</text>

  <!-- 上段の異常マップ：欠陥ピークが失われる -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <path d="M550 94H650V182H550Z"/><path d="M566 166C580 150 592 152 603 158C614 164 626 160 638 148"/>
    <path d="M566 166H638" opacity=".28"/>
  </g>
  <g stroke="currentColor" fill="hsl(var(--background))" stroke-width="1.25"><circle cx="568" cy="84" r="17"/></g><text x="568" y="84" fill="currentColor" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central">05</text>

  <!-- 上段判定装置と結果 -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <path d="M650 138H694" marker-end="url(#flow-arrow-h02)"/><path d="M700 96H790V180H700Z"/><circle cx="745" cy="138" r="27"/><path d="M745 138L766 119"/><circle cx="745" cy="138" r="4"/>
    <path d="M790 138H836"/><path d="M836 106H930V170H836Z"/><path d="M850 122H916V154H850Z" fill="url(#neutral-hatch-h02)"/>
  </g>
  <g stroke="currentColor" fill="hsl(var(--background))" stroke-width="1.25"><circle cx="854" cy="96" r="17"/></g><text x="854" y="96" fill="currentColor" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central">06</text>

  <!-- 下段：異常マップ側にマスク -->
  <!-- 同じ入力画像 -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <rect x="62" y="262" width="118" height="112"/><circle cx="121" cy="318" r="37"/><circle cx="121" cy="318" r="12"/><path d="M151 293L163 285M157 299L169 291"/>
    <circle cx="74" cy="274" r="3"/><circle cx="168" cy="274" r="3"/><circle cx="74" cy="362" r="3"/><circle cx="168" cy="362" r="3"/>
  </g>

  <!-- 07 前処理：欠陥を保持 -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <path d="M220 278H328V358H220Z"/><circle cx="274" cy="318" r="28"/><circle cx="274" cy="318" r="9"/><path d="M297 297L309 289M303 303L315 295"/>
    <path d="M180 318H220M328 318H370" marker-end="url(#flow-arrow-h02)"/>
  </g>
  <g stroke="currentColor" fill="hsl(var(--background))" stroke-width="1.25"><circle cx="238" cy="268" r="17"/></g><text x="238" y="268" fill="currentColor" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central">07</text>

  <!-- 同じモデル -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <path d="M370 272H454V364H370Z"/><path d="M382 288H442V302H382ZM382 312H442V326H382ZM382 336H442V350H382Z"/><path d="M454 318H492" marker-end="url(#flow-arrow-h02)"/>
  </g>

  <!-- 欠陥ピークを保持した異常マップ -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <path d="M492 274H592V362H492Z"/><path d="M508 346C522 338 528 326 536 300C544 326 551 338 566 346C574 350 582 344 586 336"/>
    <circle cx="536" cy="300" r="6" stroke="hsl(var(--primary))"/>
  </g>

  <!-- 08 推論後マスク：異常マップの対象外だけを除く -->
  <g stroke="hsl(var(--primary))" stroke-width="2" vector-effect="non-scaling-stroke">
    <path d="M616 268H670V368H616Z" fill="url(#mask-hatch-h02)"/><path d="M626 280H660V356H626Z" fill="hsl(var(--background))"/><circle cx="643" cy="318" r="9" fill="hsl(var(--background))"/>
    <path d="M592 318H616M670 318H704"/>
  </g>
  <g stroke="hsl(var(--primary))" fill="hsl(var(--background))" stroke-width="1.5"><circle cx="643" cy="258" r="17"/></g><text x="643" y="258" fill="hsl(var(--primary))" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central">08</text>

  <!-- 下段判定装置と結果 -->
  <g stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <path d="M704 276H790V360H704Z"/><circle cx="747" cy="318" r="27"/><path d="M747 318L759 294"/><circle cx="747" cy="318" r="4"/>
    <path d="M790 318H836"/><path d="M836 286H930V350H836Z"/><path d="M850 302H916V334H850Z"/>
  </g>
  <g stroke="currentColor" fill="hsl(var(--background))" stroke-width="1.25"><circle cx="854" cy="276" r="17"/></g><text x="854" y="276" fill="currentColor" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central">09</text>
</svg>
