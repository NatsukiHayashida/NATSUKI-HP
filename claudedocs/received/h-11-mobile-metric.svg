<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280"><style>.t{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;fill:currentColor}.l{fill:none;stroke:currentColor;stroke-width:2}.a{fill:hsl(var(--primary))}.al{fill:none;stroke:hsl(var(--primary));stroke-width:3}.h{font-size:29px;font-weight:700}.b{font-size:23px}.s{font-size:19px}.n{font-size:48px;font-weight:750}</style><defs><pattern id="p11" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="l" stroke-width="1" d="M0 0v10"/></pattern></defs>
<text class="t h" x="36" y="54">検出率100%だけでは、モデルを評価できない</text><path class="l" d="M36 76h648" opacity=".4"/>
<g transform="translate(60 128)"><text class="t b" x="300" text-anchor="middle">全品を「不良」と判定</text><rect class="l" y="34" width="600" height="360"/><path class="l" d="M0 214h600"/><rect y="34" width="600" height="180" fill="url(#p11)"/><rect y="214" width="600" height="180" fill="url(#p11)"/><text class="t s" x="22" y="72">実際は良品 283枚</text><text class="t n" x="300" y="146" text-anchor="middle">283枚を廃棄</text><text class="t s" x="22" y="252">実際は不良 178枚</text><text class="t n" x="300" y="328" text-anchor="middle">178枚を停止</text><text class="t n a" x="300" y="462" text-anchor="middle">検出率 100%</text></g>
<path class="l" d="M36 638h648" opacity=".4"/>
<g transform="translate(60 694)"><text class="t b" x="300" text-anchor="middle">実際に動かしたモデル</text><rect class="l" y="34" width="600" height="360"/><path class="l" d="M0 214h600M265 34v180"/><rect y="34" width="265" height="180" fill="url(#p11)"/><rect y="214" width="600" height="180" fill="url(#p11)"/><text class="t s" x="22" y="72">実際は良品 283枚</text><text class="t b" x="132" y="142" text-anchor="middle">125枚を廃棄</text><text class="t b" x="432" y="142" text-anchor="middle">158枚を通過</text><text class="t s" x="22" y="252">実際は不良 178枚</text><text class="t n" x="300" y="328" text-anchor="middle">178枚を停止</text><text class="t n a" x="300" y="462" text-anchor="middle">検出率 100%</text></g>
<path class="al" d="M36 1212h648"/><text class="t b" x="360" y="1252" text-anchor="middle">違いは、旧指標が見ていなかった「良品側」にある</text></svg>
