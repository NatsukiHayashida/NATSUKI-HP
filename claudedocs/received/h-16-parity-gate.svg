<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><style>.t{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;fill:currentColor}.l{fill:none;stroke:currentColor;stroke-width:2}.thin{fill:none;stroke:currentColor;stroke-width:1}.a{fill:hsl(var(--primary))}.al{fill:none;stroke:hsl(var(--primary));stroke-width:3}.h{font-size:29px;font-weight:700}.b{font-size:21px}.s{font-size:17px}.n{font-size:34px;font-weight:750}</style>
<text class="t h" x="54" y="58">全部の検査に合格した。しかし、その図面では加工できなかった。</text><path class="thin" d="M54 80h1092"/>
<g transform="translate(54 122)"><text class="t b" x="220" text-anchor="middle">原本</text><rect class="l" x="90" y="32" width="260" height="370"/><text class="t n" x="220" y="92" text-anchor="middle">A4 縦</text><text class="t n" x="220" y="150" text-anchor="middle">尺度 1:1</text><g class="l" transform="translate(140 178)"><rect width="70" height="55"/><rect x="90" width="70" height="55"/><rect x="45" y="72" width="70" height="55"/></g><text class="t b" x="220" y="326" text-anchor="middle">投影図 3面</text><text class="t s" x="220" y="358" text-anchor="middle">品番リスト・一般公差</text><text class="t s" x="220" y="384" text-anchor="middle">面粗さ・面取り あり</text></g>
<path class="l" d="M480 320h80m-12-10 12 10-12 10"/>
<g transform="translate(620 122)"><text class="t b" x="260" text-anchor="middle">納品したもの</text><rect class="l" x="40" y="62" width="440" height="350"/><text class="t n" x="260" y="116" text-anchor="middle">A3 横</text><text class="t n" x="260" y="170" text-anchor="middle">尺度 2:1</text><rect class="l" x="190" y="195" width="140" height="90"/><text class="t b" x="260" y="326" text-anchor="middle">投影図 1面</text><text class="t s a" x="260" y="362" text-anchor="middle">品番リスト・一般公差</text><text class="t s a" x="260" y="390" text-anchor="middle">面粗さ・面取り 欠落</text></g>
<g transform="translate(100 570)"><rect class="l" width="1000" height="92"/><text class="t b" x="28" y="38">検査していた</text><text class="t s" x="28" y="68">寸法・表題欄・図枠の内部整合</text><text class="t n" x="870" y="58" text-anchor="middle">全ゲート合格</text></g>
<g transform="translate(100 686)"><path class="al" d="M0 0h1000"/><text class="t b a" x="0" y="40">検査していなかった：原本との一致</text><text class="t s" x="0" y="72">用紙・尺度・投影図・リスト・注記の差は、パリティ照合を入れるまで無検査で通過</text></g>
<text class="t b" x="600" y="798" text-anchor="middle">門は、門が見ている対象しか守らない</text></svg>
