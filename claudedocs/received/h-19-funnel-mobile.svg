<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1580" viewBox="0 0 720 1580"><style>.t{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;fill:currentColor}.l{fill:none;stroke:currentColor;stroke-width:2}.q{fill:none;stroke:currentColor;stroke-width:1}.a{fill:hsl(var(--primary))}.al{fill:none;stroke:hsl(var(--primary));stroke-width:4}.h{font-size:29px;font-weight:700}.b{font-size:23px}.s{font-size:19px}.n{font-size:48px;font-weight:750}</style>
<text class="t h" x="36" y="52">直すべきは、サイトへ来る前だった</text><path class="q" d="M36 76h648"/>
<g transform="translate(90 126)"><text class="t s">SNS閲覧</text><text class="t n" x="540" y="8" text-anchor="end">86,000</text><path class="l" d="M270 34v52m-9-10 9 10 9-10"/><text class="t s" x="304" y="70">2.2%</text><text class="t s" y="130">プロフィール</text><text class="t n" x="540" y="138" text-anchor="end">1,865</text><path class="l" d="M270 164v52m-9-10 9 10 9-10"/><text class="t s" x="304" y="200">44%</text><text class="t s" y="260">外部リンク</text><text class="t n a" x="540" y="268" text-anchor="end">816</text><text class="t b a" x="270" y="312" text-anchor="middle">前期間比 28.5%減</text><path class="l" d="M270 338v52m-9-10 9 10 9-10"/><text class="t s" x="304" y="374">約2.9%</text><text class="t s" y="434">EC注文</text><text class="t n" x="540" y="442" text-anchor="end">24</text></g>
<path class="q" d="M36 622h648"/><g transform="translate(60 674)"><text class="t b">サイト内は健全だった</text><rect class="l" y="36" width="600" height="350"/><path class="q" d="M0 123h600M0 210h600M0 297h600"/><text class="t s" x="24" y="88">分析した注文</text><text class="t n" x="570" y="94" text-anchor="end">9,047件</text><text class="t s" x="24" y="175">購入者</text><text class="t n" x="570" y="181" text-anchor="end">2,174人</text><text class="t s" x="300" y="203" text-anchor="middle">2回以上617人／5回以上118人</text><text class="t s" x="24" y="262">売上のリピート</text><text class="t n" x="570" y="268" text-anchor="end">約半分</text><text class="t s" x="24" y="349">カゴ落ち率</text><text class="t n" x="570" y="355" text-anchor="end">改善</text></g>
<g transform="translate(60 1130)"><text class="t b">以前の水準に必要なタップ</text><text class="t s" y="74">現在</text><rect class="l" x="110" y="42" width="163" height="58"/><text class="t n a" x="191" y="87" text-anchor="middle">816</text><text class="t s" y="164">必要</text><rect class="l" x="110" y="132" width="490" height="58"/><text class="t n" x="355" y="177" text-anchor="middle">2,400／月</text><text class="t b" x="300" y="240" text-anchor="middle">いまの約3倍</text></g>
<path class="q" d="M36 1460h648"/><text class="t b" x="360" y="1506" text-anchor="middle">サイトを作り直しても入口は増えない。</text><text class="t b" x="360" y="1544" text-anchor="middle">だから、作らないと決めた。</text></svg>
